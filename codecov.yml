# Codecov 配置。
#
# `build.rs` 被排除在覆盖率之外。原因不是"没写测试"，而是结构性无法覆盖：
# 构建脚本在 `cargo test` 的编译阶段就已执行完毕，测试运行时不会再跑它，
# 因此它产生的 profraw 里没有任何属于它的执行记录。把它算进分母，
# 只会让 patch 覆盖率被一段永远不可能被执行到的代码持续拉低。
#
# 它的可测逻辑——环境变量解析、四个校验分支、字面量往返、生成源码——
# 都已抽到 `build_support.rs`，由 `src/lib.rs` 在 cfg(test) 下编译并单测。
# 所以这里排掉的只是"读环境变量 + 写文件"这几行胶水。
#
# grcov 那侧也有一条同样的 `--ignore "build.rs"`，两层一致；
# 即便 lcov 里意外带上了它，这里也会再挡一次。
ignore:
  - "build.rs"
